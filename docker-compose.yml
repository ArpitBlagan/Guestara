version: "3.5"
services:
  backend:
    build: .
    container_name: back
    ports:
      - "8090:8090" # Bind the container's port 8000 to the host
    environment:
      PORT: 8090
      SECRET: "@31da123dsf"
      DATABASE_URL: "postgresql://admin:password@db:5432/postgres" # Updated for PostgreSQL

  db:
    image: postgres
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: admin # Default PostgreSQL username
      POSTGRES_PASSWORD: password # Default PostgreSQL password
      POSTGRES_DB: postgres # Default PostgreSQL database name
    ports:
      - "5432:5432" # Bind the container's port 5432 to the host
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
